<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101510">
    <title>Halloweenowy spacer Małych Przyjaciół — Mapa Nocy</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #101510;
            --surface: #1b211b;
            --surface-raised: #252d25;
            --border: #394339;
            --orange: #ff7a28;
            --green: #b7d6a2;
            --text: #f1f0e8;
            --muted: #a7afa2;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px 48px;
            background-color: var(--bg);
            background-image: radial-gradient(ellipse at 50% 0%, #273126 0%, transparent 58%);
            color: var(--text);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        .container { width: min(100%, 620px); margin: 0 auto; }

        header { margin: 8px 0 30px; text-align: center; }

        h1 {
            margin: 0 0 8px;
            color: var(--orange);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.7rem, 7vw, 2.35rem);
            line-height: 1.15;
        }

        .subtitle {
            color: var(--green);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .route-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--orange);
            background: var(--surface);
        }

        .route-summary strong { display: block; margin-bottom: 4px; }
        .route-summary span { color: var(--muted); font-size: 0.88rem; }
        .route-count { color: var(--green) !important; white-space: nowrap; }

        h2 { margin: 0 0 7px; font-size: 1.2rem; }

        .hint { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }

        .route-list { margin: 0 0 22px; padding: 0; list-style: none; }

        .route-item {
            display: flex;
            min-height: 62px;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
            padding: 10px 12px 10px 15px;
            border: 1px solid var(--border);
            background: var(--surface);
        }

        .item-info { display: flex; min-width: 0; align-items: center; gap: 12px; }

        .stop-number {
            display: grid;
            width: 30px;
            height: 30px;
            flex: 0 0 30px;
            place-items: center;
            border-radius: 50%;
            background: var(--surface-raised);
            color: var(--green);
            font-size: 0.82rem;
            font-weight: 700;
        }

        .icon { font-size: 1.25rem; }
        .address { overflow-wrap: anywhere; }
        .controls { display: flex; flex: 0 0 auto; gap: 5px; }

        .btn-arrow {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface-raised);
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-arrow:hover:not(:disabled), .btn-arrow:focus-visible { border-color: var(--green); color: var(--green); }
        .btn-arrow:disabled { cursor: not-allowed; opacity: 0.35; }

        .btn-action {
            display: flex;
            min-height: 54px;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 14px 18px;
            background: var(--orange);
            color: #20170f;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: background-color 160ms ease;
        }

        .btn-action:hover, .btn-action:focus-visible { background: #ff9959; }
        :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

        @media (max-width: 420px) {
            body { padding: 24px 14px 36px; }
            .route-item { padding-left: 10px; }
            .item-info { gap: 8px; }
            .stop-number { width: 27px; height: 27px; flex-basis: 27px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>🎃 Halloweenowy spacer Małych Przyjaciół</h1>
            <div class="subtitle">TRASA SPACERKU</div>
        </header>

        <section class="route-summary" aria-label="Podsumowanie trasy">
            <div>
                <strong>Wyruszamy o godz. 18:30, spotykamy się przy cukierni Śliwa.</strong>
                <span>Przystanki są podane poniżej.</span>
            </div>
            <span class="route-count" id="routeCount"></span>
        </section>

        <section aria-labelledby="stopsHeading">
            <h2 id="stopsHeading">📍 Kolejność przystanków</h2>
            <p class="hint">Zmień kolejność strzałkami. Gotową trasę otworzysz w Google Maps.</p>
            <ol class="route-list" id="routeList" aria-label="Przystanki trasy"></ol>
        </section>

        <a class="btn-action" id="googleMapsBtn" target="_blank" rel="noopener noreferrer">
            <span aria-hidden="true">🗺️</span> Otwórz trasę w Google Maps
        </a>
    </main>

    <script>
        const addresses = [
            { name: "Ul. Pomorska 8", icon: "👻" },
            { name: "Ul. Lea 5a", icon: "🍬" },
            { name: "Ul. Chopina 6", icon: "👻" },
            { name: "Ul. Karłowicza 5", icon: "🍬" },
            { name: "Ul. Szymanowskiego 10", icon: "👻" },
            { name: "Ul. Retoryka 5", icon: "🍬" },
            { name: "Al. Słowackiego 13", icon: "👻" },
            { name: "Ul. Konarskiego 50", icon: "🍬" }
        ];

        const listContainer = document.getElementById("routeList");
        const mapsButton = document.getElementById("googleMapsBtn");

        function renderList() {
            listContainer.replaceChildren();

            addresses.forEach((address, index) => {
                const item = document.createElement("li");
                item.className = "route-item";

                const info = document.createElement("div");
                info.className = "item-info";

                const number = document.createElement("span");
                number.className = "stop-number";
                number.textContent = String(index + 1);

                const icon = document.createElement("span");
                icon.className = "icon";
                icon.setAttribute("aria-hidden", "true");
                icon.textContent = address.icon;

                const name = document.createElement("span");
                name.className = "address";
                name.textContent = address.name;

                info.append(number, icon, name);

                const controls = document.createElement("div");
                controls.className = "controls";

                const upButton = createMoveButton("Przenieś wyżej", "▲", index, -1, index === 0);
                const downButton = createMoveButton("Przenieś niżej", "▼", index, 1, index === addresses.length - 1);
                controls.append(upButton, downButton);

                item.append(info, controls);
                listContainer.appendChild(item);
            });

            document.getElementById("routeCount").textContent = `${addresses.length} punktów`;
            updateGoogleMapsLink();
        }

        function createMoveButton(label, symbol, index, offset, disabled) {
            const button = document.createElement("button");
            button.className = "btn-arrow";
            button.type = "button";
            button.textContent = symbol;
            button.setAttribute("aria-label", `${label}: ${addresses[index].name}`);
            button.disabled = disabled;
            button.addEventListener("click", () => moveStop(index, offset));
            return button;
        }

        function moveStop(index, offset) {
            const targetIndex = index + offset;
            if (targetIndex < 0 || targetIndex >= addresses.length) return;
            [addresses[index], addresses[targetIndex]] = [addresses[targetIndex], addresses[index]];
            renderList();
        }

        function updateGoogleMapsLink() {
            const stops = addresses.map(address => `${address.name}, Kraków`);
            const params = new URLSearchParams({
                api: "1",
                origin: stops[0],
                destination: stops[stops.length - 1],
                waypoints: stops.slice(1, -1).join("|"),
                travelmode: "walking"
            });
            mapsButton.href = `https://www.google.com/maps/dir/?${params.toString()}`;
        }

        renderList();
    </script>
</body>
</html>
